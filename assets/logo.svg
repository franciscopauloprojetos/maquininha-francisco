<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" width="100%" height="100%">
  <!-- Defs / Gradients -->
  <defs>
    <linearGradient id="konzGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ba50"/>
      <stop offset="100%" stop-color="#009640"/>
    </linearGradient>
    <linearGradient id="konzDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Logo Symbol / Icon (Geometric K & Payment Symbol) -->
  <g transform="translate(2, 4)">
    <!-- Base background rounded tile -->
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#konzDark)"/>
    
    <!-- Stylized Geometric K in Green -->
    <!-- Left vertical bar -->
    <rect x="7" y="7" width="4.5" height="18" rx="2" fill="#ffffff"/>
    
    <!-- Diagonal Upper Arm -->
    <path d="M12.5 16.5 L19.5 8.5 C20.2 7.7 21.5 7.7 22.2 8.5 C23 9.3 23 10.5 22.2 11.3 L16.5 17.5 L23 23.8 C23.8 24.6 23.8 25.8 23 26.6 C22.2 27.4 21 27.4 20.2 26.6 L12.5 18.5 Z" fill="url(#konzGreen)"/>
    
    <!-- Glowing small dot/accent -->
    <circle cx="21" cy="18" r="2" fill="#00ba50"/>
  </g>

  <!-- Typography / Brand Name: KONZPAY -->
  <text x="44" y="26" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#0f172a">KONZ</tspan><tspan fill="#00ba50">PAY</tspan>
  </text>
</svg>
